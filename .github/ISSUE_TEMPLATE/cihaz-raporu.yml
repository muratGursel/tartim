name: Cihaz raporu
description: 'tartim rapor ile ya da arayüzdeki "Cihaz raporu" düğmesiyle hazırlanan dosyayı gönderin'
title: "Cihaz raporu: "
labels: ["cihaz-raporu"]
body:
  - type: markdown
    attributes:
      value: |
        Katkınız için teşekkürler! Raporu Tartım uygulamasındaki **Cihaz raporu**
        düğmesiyle ya da `tartim rapor` komutuyla hazırlayın. Oluşan
        `tartim-rapor-....json` dosyasını aşağıdaki **Rapor dosyası** kutusuna
        sürükleyip bırakın. Adım adım anlatım:
        [Kullanım kılavuzu](https://github.com/muratGursel/tartim/blob/main/docs/KULLANIM.md#7-cihaz-raporu-hazırlamak-ve-göndermek)

        **Gerçek bir danışanın ölçümünü göndermeyin.** Ölçümü kendinizle ya da bir
        test kişisiyle yapın.
  - type: input
    id: model
    attributes:
      label: Cihaz modeli
      placeholder: ör. MC-780MA
    validations:
      required: true
  - type: textarea
    id: rapor
    attributes:
      label: Rapor dosyası
      description: JSON dosyasını buraya sürükleyin.
    validations:
      required: true
  - type: textarea
    id: notlar
    attributes:
      label: Notlar
      description: Karşılaştığınız sorunlar, cihaz ayarları vb. (isteğe bağlı)
  - type: checkboxes
    id: onay
    attributes:
      label: Onay
      options:
        - label: Bu ölçüm gerçek bir danışana ait değildir.
          required: true
