name: Test and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-serial python3-yaml socat
      - name: Tests
        run: python3 -m unittest -v

  deb:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the package
        id: build
        run: echo "deb=$(sh packaging/build-deb.sh)" >> "$GITHUB_OUTPUT"
      - name: Install and try the package
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q "${{ steps.build.outputs.deb }}"
          tartim --version
          tartim list
          # The Turkish command names of earlier releases must keep working.
          tartim --surum
          TARTIM_LANG=tr tartim listele
      - uses: actions/upload-artifact@v4
        with:
          name: tartim-deb
          path: dist/*.deb
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            docs/Tartim-Kullanim-Kilavuzu.pdf
            docs/Tartim-User-Guide.pdf
          generate_release_notes: true
