[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tartim"
version = "0.8.0"
description = "Body composition analyzer (Tanita-compatible) reader for Pardus/Linux"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5", "reportlab>=3.6"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Natural Language :: English",
    "Natural Language :: Turkish",
]

[project.scripts]
tartim = "tartim.cli:main"

[tool.setuptools]
packages = ["tartim"]

[tool.setuptools.package-data]
tartim = ["locale/*.po"]
