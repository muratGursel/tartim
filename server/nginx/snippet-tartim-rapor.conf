# /etc/nginx/snippets/tartim-rapor.conf
# Added to the site's "server { listen 443 ssl; ... }" block with:
#     include snippets/tartim-rapor.conf;
location ^~ /tartim/ {
    limit_req zone=tartim_rapor burst=5 nodelay;
    client_max_body_size 2m;
    proxy_pass http://127.0.0.1:8095;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 30s;
}
